<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Sentinel Armory operations workflow</title><desc id="desc">Inventory state moves through condition flags and staff review to an inventory decision; exceptions escalate for review.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c0b20"/><stop offset="1" stop-color="#1e1745"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#c6f04b"/></marker></defs><rect width="1600" height="1000" rx="42" fill="url(#bg)"/><path d="M100 180H1500" stroke="#fff" opacity=".12"/><text x="100" y="112" fill="#c6f04b" font-family="monospace" font-size="25" letter-spacing="5">03 / OPERATIONS INTERFACE</text><text x="1500" y="112" text-anchor="end" fill="#fff" opacity=".55" font-family="monospace" font-size="20" letter-spacing="2">INTERACTIVE DEMO · SIMULATED DATA</text><g font-family="Arial,sans-serif"><text x="100" y="260" fill="#fff" font-size="56" font-weight="700">State before action.</text><text x="100" y="325" fill="#c6f04b" font-size="56" font-weight="700">Exceptions stay visible.</text><text x="100" y="382" fill="#fff" opacity=".7" font-size="24">An operations surface gives a person the context</text><text x="100" y="416" fill="#fff" opacity=".7" font-size="24">to pause, check and escalate.</text></g><g fill="#17133a" stroke="#fff" stroke-opacity=".24" stroke-width="2"><rect x="100" y="530" width="300" height="190" rx="18"/><rect x="470" y="530" width="300" height="190" rx="18"/><rect x="840" y="530" width="300" height="190" rx="18"/><rect x="1210" y="530" width="290" height="190" rx="18"/></g><g fill="none" stroke="#c6f04b" stroke-width="4" marker-end="url(#arrow)"><path d="M400 625h58"/><path d="M770 625h58"/><path d="M1140 625h58"/></g><g font-family="Arial,sans-serif" fill="#fff"><g transform="translate(132 568)"><text fill="#c6f04b" font-family="monospace" font-size="18">01 / LOCATE</text><text y="53" font-size="30" font-weight="700">Catalogue</text><text y="94" font-size="19" opacity=".72">item + current state</text></g><g transform="translate(502 568)"><text fill="#c6f04b" font-family="monospace" font-size="18">02 / CHECK</text><text y="53" font-size="29" font-weight="700"><tspan x="0">Condition</tspan><tspan x="0" dy="34">flags</tspan></text><text y="133" font-size="18" opacity=".72">issue + exception</text></g><g transform="translate(872 568)"><text fill="#c6f04b" font-family="monospace" font-size="18">03 / REVIEW</text><text y="53" font-size="30" font-weight="700">Staff gate</text><text y="94" font-size="19" opacity=".72">pause + escalate</text></g><g transform="translate(1242 568)"><text fill="#c6f04b" font-family="monospace" font-size="18">04 / DECIDE</text><text y="53" font-size="29" font-weight="700"><tspan x="0">Inventory</tspan><tspan x="0" dy="34">action</tspan></text><text y="133" font-size="18" opacity=".72">authorised next move</text></g></g><path d="M595 720v55H430" fill="none" stroke="#f07a5b" stroke-width="3" stroke-dasharray="8 10" marker-end="url(#arrow)"/><rect x="180" y="780" width="500" height="92" rx="16" fill="#3d1d3b" stroke="#f07a5b" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="212" y="820" fill="#f07a5b" font-size="24" font-weight="700">Exception / escalate</text><text x="212" y="851" fill="#fff" opacity=".78" font-size="18">No silent movement past a flagged state.</text></g><g font-family="monospace" fill="#c6f04b" font-size="18"><text x="100" y="930">DECISION / CONDITION BEFORE INVENTORY ACTION</text><text x="1500" y="930" text-anchor="end">NEXT / PERMISSIONS + AUDIT TRAIL</text></g></svg>
