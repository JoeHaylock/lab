<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">TRACE evidence triage workflow</title><desc id="desc">A scripted evidence workflow moves from a case brief through source review, confidence and gaps to an analyst review gate; contradictions branch into an unresolved hold.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e0a29"/><stop offset="1" stop-color="#24134d"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#c6f04b"/></marker></defs><rect width="1600" height="1000" rx="42" fill="url(#bg)"/><path d="M100 180H1500" stroke="#fff" opacity=".12"/><text x="100" y="112" fill="#c6f04b" font-family="monospace" font-size="25" letter-spacing="5">02 / EVIDENCE TRIAGE</text><text x="1500" y="112" text-anchor="end" fill="#fff" opacity=".55" font-family="monospace" font-size="20" letter-spacing="2">SCRIPTED PROTOTYPE · SYNTHETIC DATA</text><g font-family="Arial,sans-serif"><text x="100" y="260" fill="#fff" font-size="56" font-weight="700">Let the system draft.</text><text x="100" y="325" fill="#c6f04b" font-size="56" font-weight="700">Keep the decision human.</text><text x="100" y="382" fill="#fff" opacity=".7" font-size="24">A visible source trail makes uncertainty useful</text><text x="100" y="416" fill="#fff" opacity=".7" font-size="24">before an analyst chooses what happens next.</text></g><g fill="#19113e" stroke="#fff" stroke-opacity=".24" stroke-width="2"><rect x="100" y="530" width="300" height="190" rx="18"/><rect x="470" y="530" width="300" height="190" rx="18"/><rect x="840" y="530" width="300" height="190" rx="18"/><rect x="1210" y="530" width="290" height="190" rx="18"/></g><g fill="none" stroke="#c6f04b" stroke-width="4" marker-end="url(#arrow)"><path d="M400 625h58"/><path d="M770 625h58"/><path d="M1140 625h58"/></g><g font-family="Arial,sans-serif" fill="#fff"><g transform="translate(132 568)"><text fill="#c6f04b" font-family="monospace" font-size="18">01 / INPUT</text><text y="53" font-size="30" font-weight="700">Case brief</text><text y="94" font-size="19" opacity=".72">claim + context</text></g><g transform="translate(502 568)"><text fill="#c6f04b" font-family="monospace" font-size="18">02 / REVIEW</text><text y="53" font-size="30" font-weight="700">Sources</text><text y="94" font-size="19" opacity=".72">grade + corroborate</text></g><g transform="translate(872 568)"><text fill="#c6f04b" font-family="monospace" font-size="18">03 / ASSESS</text><text y="53" font-size="29" font-weight="700"><tspan x="0">Confidence</tspan><tspan x="0" dy="34">+ gaps</tspan></text><text y="133" font-size="18" opacity=".72">show what is missing</text></g><g transform="translate(1242 568)"><text fill="#c6f04b" font-family="monospace" font-size="18">04 / GATE</text><text y="53" font-size="29" font-weight="700"><tspan x="0">Analyst</tspan><tspan x="0" dy="34">review</tspan></text><text y="133" font-size="18" opacity=".72">no automatic action</text></g></g><path d="M990 720v55H760" fill="none" stroke="#f07a5b" stroke-width="3" stroke-dasharray="8 10" marker-end="url(#arrow)"/><rect x="300" y="780" width="500" height="92" rx="16" fill="#3d1d4b" stroke="#f07a5b" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="332" y="820" fill="#f07a5b" font-size="24" font-weight="700">Contradiction / hold</text><text x="332" y="851" fill="#fff" opacity=".78" font-size="18">Unresolved evidence stays unresolved.</text></g><g font-family="monospace" fill="#c6f04b" font-size="18"><text x="100" y="930">DECISION / SOURCE TRAIL BESIDE THE VERDICT</text><text x="1500" y="930" text-anchor="end">NEXT / TEST CALIBRATION BEFORE A MODEL</text></g></svg>
