<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">South Willingham demo workflow</title><desc id="desc">A parish visitor finds the hall, reads what is on, and reaches a contact route. This is an archived demo, not a live commission.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#100b2c"/><stop offset="1" stop-color="#251650"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#c6f04b"/></marker></defs><rect width="1600" height="1000" rx="42" fill="url(#bg)"/><text x="100" y="112" fill="#c6f04b" font-family="monospace" font-size="25" letter-spacing="5">06 / SOUTH WILLINGHAM</text><text x="1500" y="112" text-anchor="end" fill="#fff" opacity=".55" font-family="monospace" font-size="20">ARCHIVED DEMO</text><text x="100" y="260" fill="#fff" font-size="56" font-weight="700" font-family="Arial,sans-serif">Find the hall.</text><text x="100" y="325" fill="#c6f04b" font-size="56" font-weight="700" font-family="Arial,sans-serif">Reach a person.</text><g fill="#19113e" stroke="#fff" stroke-opacity=".24" stroke-width="2"><rect x="100" y="530" width="420" height="190" rx="18"/><rect x="590" y="530" width="420" height="190" rx="18"/><rect x="1080" y="530" width="420" height="190" rx="18"/></g><g fill="none" stroke="#c6f04b" stroke-width="4" marker-end="url(#arrow)"><path d="M520 625h58"/><path d="M1010 625h58"/></g><g font-family="Arial,sans-serif" fill="#fff"><text x="130" y="590" font-size="22">Home</text><text x="130" y="630" fill="#c6f04b" font-size="18">Village and hall</text><text x="620" y="590" font-size="22">What's on</text><text x="620" y="630" fill="#c6f04b" font-size="18">Events and hiring</text><text x="1110" y="590" font-size="22">Contact</text><text x="1110" y="630" fill="#c6f04b" font-size="18">Demo enquiry only</text></g></svg>
