<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Mountain Ash customer acquisition workflow</title><desc id="desc">Campaign attention moves through the website and enquiry form to an AI-assisted quote handoff and Charlie's phone, with virtual-landline reachability as a parallel route.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#100b2c"/><stop offset="1" stop-color="#251650"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#c6f04b"/></marker></defs><rect width="1600" height="1000" rx="42" fill="url(#bg)"/><path d="M100 180H1500" stroke="#fff" opacity=".12"/><text x="100" y="112" fill="#c6f04b" font-family="monospace" font-size="25" letter-spacing="5">01 / CUSTOMER ACQUISITION</text><text x="1500" y="112" text-anchor="end" fill="#fff" opacity=".55" font-family="monospace" font-size="20" letter-spacing="2">LIVE WEBSITE · CLIENT ROUTE</text><g font-family="Arial,sans-serif"><text x="100" y="260" fill="#fff" font-size="56" font-weight="700">From attention</text><text x="100" y="325" fill="#c6f04b" font-size="56" font-weight="700">to reachable work.</text><text x="100" y="382" fill="#fff" opacity=".7" font-size="24">A customer journey designed around the business owner,</text><text x="100" y="416" fill="#fff" opacity=".7" font-size="24">not just the page a visitor first sees.</text></g><g fill="#19113e" stroke="#fff" stroke-opacity=".24" stroke-width="2"><rect x="100" y="530" width="300" height="190" rx="18"/><rect x="470" y="530" width="300" height="190" rx="18"/><rect x="840" y="530" width="300" height="190" rx="18"/><rect x="1210" y="530" width="290" height="190" rx="18"/></g><g fill="none" stroke="#c6f04b" stroke-width="4" marker-end="url(#arrow)"><path d="M400 625h58"/><path d="M770 625h58"/><path d="M1140 625h58"/></g><g font-family="Arial,sans-serif" fill="#fff"><g transform="translate(132 568)"><text fill="#c6f04b" font-family="monospace" font-size="18">01 / ATTRACT</text><text y="53" font-size="30" font-weight="700">Campaign</text><text y="94" font-size="19" opacity=".72">clear promise · right audience</text></g><g transform="translate(502 568)"><text fill="#c6f04b" font-family="monospace" font-size="18">02 / CAPTURE</text><text y="53" font-size="29" font-weight="700"><tspan x="0">Website +</tspan><tspan x="0" dy="34">enquiry</tspan></text><text y="133" font-size="18" opacity=".72">project framing · useful detail</text></g><g transform="translate(872 568)"><text fill="#c6f04b" font-family="monospace" font-size="18">03 / PREPARE</text><text y="53" font-size="28" font-weight="700"><tspan x="0">AI-assisted</tspan><tspan x="0" dy="34">quote handoff</tspan></text><text y="133" font-size="18" opacity=".72">context travels with the job</text></g><g transform="translate(1242 568)"><text fill="#c6f04b" font-family="monospace" font-size="18">04 / REACH</text><text y="53" font-size="29" font-weight="700"><tspan x="0">Charlie's</tspan><tspan x="0" dy="34">phone</tspan></text><text y="133" font-size="18" opacity=".72">the next person can act</text></g></g><path d="M990 720v55H760" fill="none" stroke="#c6f04b" stroke-width="3" stroke-dasharray="8 10" marker-end="url(#arrow)"/><rect x="430" y="780" width="540" height="92" rx="16" fill="#c6f04b"/><g font-family="Arial,sans-serif" fill="#111028"><text x="462" y="820" font-size="24" font-weight="700">Virtual-landline reachability</text><text x="462" y="851" font-size="18">A parallel route keeps the business contactable.</text></g><g font-family="monospace" fill="#c6f04b" font-size="18"><text x="100" y="930">DECISION / ONE CONTINUOUS ROUTE</text><text x="1500" y="930" text-anchor="end">NEXT / MEASURE REAL ENQUIRY FOLLOW-UP</text></g></svg>
