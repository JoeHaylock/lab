<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">OrbitSentry orbital console workflow</title><desc id="desc">TLE data is propagated into a globe and detail view; data age and API availability determine the honest snapshot fallback.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b0926"/><stop offset="1" stop-color="#1b1644"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#c6f04b"/></marker></defs><rect width="1600" height="1000" rx="42" fill="url(#bg)"/><path d="M100 180H1500" stroke="#fff" opacity=".12"/><text x="100" y="112" fill="#c6f04b" font-family="monospace" font-size="25" letter-spacing="5">04 / ORBITAL CONSOLE</text><text x="1500" y="112" text-anchor="end" fill="#fff" opacity=".55" font-family="monospace" font-size="20" letter-spacing="2">PUBLIC SNAPSHOT · API OFFLINE</text><g font-family="Arial,sans-serif"><text x="100" y="260" fill="#fff" font-size="56" font-weight="700">Show the orbit.</text><text x="100" y="325" fill="#c6f04b" font-size="56" font-weight="700">Show the uncertainty.</text><text x="100" y="382" fill="#fff" opacity=".7" font-size="24">A console makes the data path and its limits</text><text x="100" y="416" fill="#fff" opacity=".7" font-size="24">part of the visualisation itself.</text></g><g fill="#17113d" stroke="#fff" stroke-opacity=".24" stroke-width="2"><rect x="100" y="530" width="300" height="190" rx="18"/><rect x="470" y="530" width="300" height="190" rx="18"/><rect x="840" y="530" width="300" height="190" rx="18"/><rect x="1210" y="530" width="290" height="190" rx="18"/></g><g fill="none" stroke="#c6f04b" stroke-width="4" marker-end="url(#arrow)"><path d="M400 625h58"/><path d="M770 625h58"/><path d="M1140 625h58"/></g><g font-family="Arial,sans-serif" fill="#fff"><g transform="translate(132 568)"><text fill="#c6f04b" font-family="monospace" font-size="18">01 / CATALOGUE</text><text y="53" font-size="30" font-weight="700">TLE data</text><text y="94" font-size="19" opacity=".72">object + element age</text></g><g transform="translate(502 568)"><text fill="#c6f04b" font-family="monospace" font-size="18">02 / PROPAGATE</text><text y="53" font-size="30" font-weight="700">SGP4 state</text><text y="94" font-size="19" opacity=".72">time → position</text></g><g transform="translate(872 568)"><text fill="#c6f04b" font-family="monospace" font-size="18">03 / EXPLAIN</text><text y="53" font-size="29" font-weight="700"><tspan x="0">Globe +</tspan><tspan x="0" dy="34">detail</tspan></text><text y="133" font-size="18" opacity=".72">track what numbers mean</text></g><g transform="translate(1242 568)"><text fill="#c6f04b" font-family="monospace" font-size="18">04 / FALLBACK</text><text y="53" font-size="29" font-weight="700"><tspan x="0">Snapshot</tspan><tspan x="0" dy="34">view</tspan></text><text y="133" font-size="18" opacity=".72">API state stays explicit</text></g></g><path d="M990 720v55H760" fill="none" stroke="#f07a5b" stroke-width="3" stroke-dasharray="8 10" marker-end="url(#arrow)"/><rect x="480" y="780" width="510" height="92" rx="16" fill="#3d1d3b" stroke="#f07a5b" stroke-width="2"/><g font-family="Arial,sans-serif"><text x="512" y="820" fill="#f07a5b" font-size="24" font-weight="700">API offline / snapshot</text><text x="512" y="851" fill="#fff" opacity=".78" font-size="18">Data age stays visible; live screening is unavailable.</text></g><g font-family="monospace" fill="#c6f04b" font-size="18"><text x="100" y="930">DECISION / FRESHNESS BESIDE THE GLOBE</text><text x="1500" y="930" text-anchor="end">NEXT / REPRODUCIBLE ORBITAL CHECKS</text></g></svg>
